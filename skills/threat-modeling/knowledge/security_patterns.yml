# Security Design Patterns Knowledge Base
# Version: 1.0.0
# Source: OWASP, Security Patterns Repository

---
authentication_patterns:
  
  multi_factor_authentication:
    name: "Multi-Factor Authentication (MFA)"
    category: Authentication
    description: |
      Require multiple forms of authentication before granting access.
      Typically combines something you know (password), something you have 
      (token), and something you are (biometric).
      
    use_cases:
      - High-security applications
      - Admin access
      - Financial transactions
      
    implementation_notes:
      - Use TOTP or hardware tokens
      - Rate limit MFA attempts
      - Provide backup codes
      - Consider user experience
      
    mitigates:
      - S: Spoofing
      - CWE-287
      - OWASP-A07
      
  certificate_authentication:
    name: "Certificate-Based Authentication"
    category: Authentication
    description: |
      Use digital certificates for authentication, typically client 
      certificates in TLS connections. Provides strong identity verification.
      
    use_cases:
      - API authentication
      - Service-to-service authentication
      - Zero-trust architectures
      
    implementation_notes:
      - Use PKI infrastructure
      - Certificate pinning
      - Certificate revocation checking
      
    mitigates:
      - S: Spoofing
      - CWE-295
      
  secure_session_management:
    name: "Secure Session Management"
    category: Authentication
    description: |
      Implement secure session handling with proper token generation, 
      storage, and lifecycle management.
      
    use_cases:
      - Web applications
      - Mobile applications
      
    implementation_notes:
      - Use cryptographically strong session IDs
      - Secure cookie attributes (Secure, HttpOnly, SameSite)
      - Session timeout
      - Session invalidation on logout
      
    mitigates:
      - S: Spoofing
      - CWE-384
      
authorization_patterns:
  
  role_based_access_control:
    name: "Role-Based Access Control (RBAC)"
    category: Authorization
    description: |
      Assign permissions based on user roles rather than individual users.
      Simplifies permission management and ensures consistent access control.
      
    use_cases:
      - Enterprise applications
      - Multi-user systems
      
    implementation_notes:
      - Define clear role hierarchy
      - Implement least privilege
      - Regular role review
      - Deny by default
      
    mitigates:
      - E: Elevation of Privilege
      - CWE-269
      - CWE-862
      
  attribute_based_access_control:
    name: "Attribute-Based Access Control (ABAC)"
    category: Authorization
    description: |
      Make access decisions based on attributes of users, resources, 
      and environment. Provides fine-grained, dynamic access control.
      
    use_cases:
      - Complex authorization requirements
      - Dynamic policy changes
      
    implementation_notes:
      - Define clear attribute schema
      - Policy engine implementation
      - Performance considerations
      
    mitigates:
      - E: Elevation of Privilege
      - CWE-863
      
  least_privilege:
    name: "Principle of Least Privilege"
    category: Authorization
    description: |
      Grant only the minimum permissions necessary for a task.
      Reduces the impact of privilege escalation attacks.
      
    use_cases:
      - All systems
      
    implementation_notes:
      - Start with no permissions
      - Add only necessary permissions
      - Regular privilege review
      - Separate duties
      
    mitigates:
      - E: Elevation of Privilege
      
input_validation_patterns:
  
  whitelist_validation:
    name: "Whitelist (Allow-list) Validation"
    category: Input Validation
    description: |
      Only accept input that matches a predefined safe pattern.
      Reject everything else. More secure than blacklist validation.
      
    use_cases:
      - All input handling
      - File uploads
      - Parameter validation
      
    implementation_notes:
      - Define strict patterns
      - Use regex carefully
      - Validate on server side
      - Consider encoding
      
    mitigates:
      - T: Tampering
      - I: Information Disclosure
      - CWE-20
      - OWASP-A03
      
  input_sanitization:
    name: "Input Sanitization"
    category: Input Validation
    description: |
      Remove or encode dangerous characters from input to prevent 
      injection attacks.
      
    use_cases:
      - HTML rendering
      - SQL queries
      - Command execution
      
    implementation_notes:
      - Use context-appropriate encoding
      - Don't rely solely on sanitization
      - Combine with validation
      
    mitigates:
      - T: Tampering
      - CWE-79
      - CWE-89
      
  parameterized_queries:
    name: "Parameterized Queries (Prepared Statements)"
    category: Input Validation
    description: |
      Use parameterized queries to separate SQL code from data.
      Prevents SQL injection by ensuring data is never interpreted as SQL.
      
    use_cases:
      - Database operations
      
    implementation_notes:
      - Use ORM where possible
      - Never concatenate SQL with input
      - Validate data types
      
    mitigates:
      - T: Tampering
      - CWE-89
      - OWASP-A03
      
cryptographic_patterns:
  
  encryption_at_rest:
    name: "Encryption at Rest"
    category: Cryptography
    description: |
      Encrypt sensitive data when stored in databases, files, or other 
      storage media.
      
    use_cases:
      - Database encryption
      - File encryption
      - Backup encryption
      
    implementation_notes:
      - Use AES-256
      - Key management system
      - Consider performance impact
      
    mitigates:
      - I: Information Disclosure
      - CWE-311
      
  encryption_in_transit:
    name: "Encryption in Transit"
    category: Cryptography
    description: |
      Encrypt all data transmitted over networks using TLS/SSL.
      
    use_cases:
      - All network communications
      
    implementation_notes:
      - Use TLS 1.2 or higher
      - Proper certificate validation
      - Disable weak protocols
      
    mitigates:
      - I: Information Disclosure
      - T: Tampering
      - CWE-319
      
  secure_key_management:
    name: "Secure Key Management"
    category: Cryptography
    description: |
      Properly manage cryptographic keys including generation, storage, 
      rotation, and destruction.
      
    use_cases:
      - All cryptographic operations
      
    implementation_notes:
      - Use HSM or key vault
      - Key rotation policies
      - Never store keys in code
      - Separate key duties
      
    mitigates:
      - I: Information Disclosure
      - CWE-321
      
logging_patterns:
  
  comprehensive_logging:
    name: "Comprehensive Security Logging"
    category: Logging
    description: |
      Log all security-relevant events including authentication, 
      authorization, input validation failures, and system events.
      
    use_cases:
      - All systems
      
    implementation_notes:
      - Log authentication events
      - Log access control decisions
      - Log input validation failures
      - Log administrative actions
      
    mitigates:
      - R: Repudiation
      - CWE-778
      
  secure_log_storage:
    name: "Secure Log Storage"
    category: Logging
    description: |
      Protect logs from tampering and unauthorized access.
      Ensure logs are preserved for forensics and compliance.
      
    use_cases:
      - All systems
      
    implementation_notes:
      - Write-only log storage
      - Log integrity verification
      - Access control on logs
      - Retention policies
      
    mitigates:
      - R: Repudiation
      
  audit_trail:
    name: "Audit Trail"
    category: Logging
    description: |
      Maintain complete audit trail of all security-relevant actions.
      Enable investigation and compliance verification.
      
    use_cases:
      - Financial systems
      - Healthcare systems
      - Regulatory compliance
      
    implementation_notes:
      - Include user identity
      - Include timestamps
      - Include action details
      - Include before/after states
      
    mitigates:
      - R: Repudiation
      
availability_patterns:
  
  rate_limiting:
    name: "Rate Limiting"
    category: Availability
    description: |
      Limit the number of requests a user or system can make within 
      a time period to prevent abuse and resource exhaustion.
      
    use_cases:
      - Public APIs
      - Authentication endpoints
      - Resource-intensive operations
      
    implementation_notes:
      - Per-user and per-IP limits
      - Gradual throttling
      - Clear error responses
      - Consider legitimate heavy users
      
    mitigates:
      - D: Denial of Service
      - CWE-770
      
  circuit_breaker:
    name: "Circuit Breaker Pattern"
    category: Availability
    description: |
      Automatically fail fast when a downstream service is failing,
      preventing cascade failures and allowing recovery.
      
    use_cases:
      - Microservices
      - External API calls
      
    implementation_notes:
      - Set failure thresholds
      - Implement fallback
      - Automatic recovery
      
    mitigates:
      - D: Denial of Service
      
  graceful_degradation:
    name: "Graceful Degradation"
    category: Availability
    description: |
      Design systems to provide reduced functionality when components 
      fail, rather than complete failure.
      
    use_cases:
      - High-availability systems
      
    implementation_notes:
      - Identify critical vs non-critical features
      - Implement fallbacks
      - Clear user communication
      
    mitigates:
      - D: Denial of Service

---
pattern_selection_guide:

  by_stride_category:
    S:
      recommended:
        - multi_factor_authentication
        - certificate_authentication
        - secure_session_management
    T:
      recommended:
        - whitelist_validation
        - parameterized_queries
        - encryption_in_transit
    R:
      recommended:
        - comprehensive_logging
        - secure_log_storage
        - audit_trail
    I:
      recommended:
        - encryption_at_rest
        - encryption_in_transit
        - secure_key_management
    D:
      recommended:
        - rate_limiting
        - circuit_breaker
        - graceful_degradation
    E:
      recommended:
        - role_based_access_control
        - least_privilege

  by_severity:
    CRITICAL:
      - multi_factor_authentication
      - parameterized_queries
      - encryption_at_rest
      - comprehensive_logging
    HIGH:
      - role_based_access_control
      - whitelist_validation
      - encryption_in_transit
      - rate_limiting
    MEDIUM:
      - input_sanitization
      - secure_session_management
      - circuit_breaker
    LOW:
      - graceful_degradation
      - audit_trail