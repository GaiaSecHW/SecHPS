# STRIDE Threat Categories Knowledge Base
# Version: 1.0.0
# Source: Microsoft SDL, OWASP

---
stride_categories:
  
  S:
    name: Spoofing
    full_name: "Spoofing Identity"
    description: "Impersonating something or someone else"
    definition: "Spoofing involves illegally accessing a system by using another user's authentication credentials. Attackers may pretend to be a valid user, a trusted system, or a legitimate service."
    applicable_elements:
      - ExternalInteractor
      - Process
      - DataFlow
    example_attacks:
      - Phishing attacks
      - Man-in-the-middle attacks
      - Session hijacking
      - Credential theft
      - IP spoofing
      - DNS spoofing
    cwe_mapping:
      - code: CWE-287
        description: Improper Authentication
      - code: CWE-384
        description: Session Fixation
      - code: CWE-294
        description: Authentication Bypass by Capture-replay
      - code: CWE-603
        description: Use of Client-Side Authentication
      - code: CWE-522
        description: Insufficiently Protected Credentials
    owasp_mapping:
      - code: A07
        description: Identification and Authentication Failures
      - code: A01
        description: Broken Access Control (partial)
    prevention_patterns:
      - Strong authentication (MFA)
      - Certificate-based authentication
      - Session tokens with entropy
      - HTTPS for all communications
      - Anti-phishing measures
      
  T:
    name: Tampering
    full_name: "Tampering with Data"
    description: "Modifying data or code without authorization"
    definition: "Tampering involves the unauthorized modification of data, either in storage, in transit, or in processing. This includes modifying files, database records, network packets, or memory contents."
    applicable_elements:
      - Process
      - DataStore
      - DataFlow
    example_attacks:
      - SQL injection
      - File tampering
      - Memory corruption
      - Parameter tampering
      - Cookie manipulation
      - Log tampering
    cwe_mapping:
      - code: CWE-89
        description: SQL Injection
      - code: CWE-79
        description: Cross-site Scripting (XSS)
      - code: CWE-352
        description: Cross-Site Request Forgery (CSRF)
      - code: CWE-47
        description: Path Equivalence
      - code: CWE-123
        description: Buffer Copy without Checking Size
    owasp_mapping:
      - code: A03
        description: Injection
      - code: A01
        description: Broken Access Control
      - code: A05
        description: Security Misconfiguration
    prevention_patterns:
      - Input validation
      - Output encoding
      - Parameterized queries
      - File integrity monitoring
      - Access control
      - Integrity checks (hashes, signatures)
      
  R:
    name: Repudiation
    full_name: "Repudiation"
    description: "Claiming to have not performed an action"
    definition: "Repudiation involves a user denying they performed an action, and the system having no way to prove otherwise. This threatens accountability and non-repudiation requirements."
    applicable_elements:
      - ExternalInteractor
      - Process
      - DataStore
      - DataFlow
    example_attacks:
      - Deleting logs
      - Disabling logging
      - Log injection
      - Timestamp manipulation
      - Denying transactions
      - Claiming unauthorized access
    cwe_mapping:
      - code: CWE-778
        description: Insufficient Logging
      - code: CWE-223
        description: Omission of Security-relevant Information
      - code: CWE-295
        description: Improper Certificate Validation
      - code: CWE-393
        description: Return Error Status without Checking
    owasp_mapping:
      - code: A09
        description: Security Logging and Monitoring Failures
    prevention_patterns:
      - Comprehensive logging
      - Secure log storage
      - Digital signatures
      - Timestamping services
      - Audit trails
      - Non-repudiation mechanisms
      
  I:
    name: Information Disclosure
    full_name: "Information Disclosure"
    description: "Exposing information to unauthorized parties"
    definition: "Information Disclosure involves exposing information to individuals who are not authorized to access it. This includes data leaks, unauthorized access to files, and exposure of sensitive information in error messages or logs."
    applicable_elements:
      - Process
      - DataStore
      - DataFlow
    example_attacks:
      - Data breach
      - Information leakage in errors
      - Directory traversal
      - Exposure of sensitive data
      - Side-channel attacks
      - Cryptographic failures
    cwe_mapping:
      - code: CWE-200
        description: Exposure of Sensitive Information
      - code: CWE-201
        description: Insertion of Sensitive Information Into Sent Data
      - code: CWE-215
        description: Insertion of Sensitive Information Into Debugging Code
      - code: CWE-532
        description: Insertion of Sensitive Information Into Log File
      - code: CWE-311
        description: Missing Encryption of Sensitive Data
    owasp_mapping:
      - code: A02
        description: Cryptographic Failures
      - code: A04
        description: Insecure Design
      - code: A05
        description: Security Misconfiguration
    prevention_patterns:
      - Encryption at rest and in transit
      - Access control for sensitive data
      - Minimal error message exposure
      - Data masking
      - Secure configuration
      - Secrets management
      
  D:
    name: Denial of Service
    full_name: "Denial of Service"
    description: "Denying or degrading service to users"
    definition: "Denial of Service involves making a system unavailable or significantly degraded for legitimate users. This includes resource exhaustion, crashes, and intentional blocking of service functionality."
    applicable_elements:
      - Process
      - DataStore
      - DataFlow
    example_attacks:
      - Resource exhaustion (CPU, memory, disk)
      - Network flooding (DDoS)
      - Application crashes
      - Locking resources
      - Request flooding
      - Dependency failures
    cwe_mapping:
      - code: CWE-400
        description: Uncontrolled Resource Consumption
      - code: CWE-770
        description: Allocation of Resources Without Limits
      - code: CWE-409
        description: Improper Handling of Highly Compressed Data
      - code: CWE-132
        description: DEPRECATED - Malloc of size zero
    owasp_mapping:
      - code: A06
        description: Vulnerable and Outdated Components (partial)
    prevention_patterns:
      - Rate limiting
      - Resource quotas
      - Input size limits
      - Graceful degradation
      - Circuit breakers
      - Redundancy and failover
      
  E:
    name: Elevation of Privilege
    full_name: "Elevation of Privilege"
    description: "Gaining capabilities without proper authorization"
    definition: "Elevation of Privilege involves a user gaining capabilities they should not have, typically higher privileges than intended. This includes vertical privilege escalation (getting admin rights) and horizontal privilege escalation (accessing other users data)."
    applicable_elements:
      - ExternalInteractor
      - Process
    example_attacks:
      - Privilege escalation
      - Role manipulation
      - Authentication bypass
      - Insecure direct object references
      - Forced browsing
      - Admin interface access
    cwe_mapping:
      - code: CWE-269
        description: Improper Privilege Management
      - code: CWE-862
        description: Missing Authorization
      - code: CWE-863
        description: Incorrect Authorization
      - code: CWE-285
        description: Improper Authorization
      - code: CWE-639
        description: Authorization Bypass Through User-Controlled Key
    owasp_mapping:
      - code: A01
        description: Broken Access Control
    prevention_patterns:
      - Role-based access control (RBAC)
      - Least privilege principle
      - Authorization checks
      - Secure defaults
      - Privilege separation
      - Mandatory access control

---
stride_element_matrix:

  ExternalInteractor:
    applicable: [S, R, E]
    not_applicable: [T, I, D]
    
  Process:
    applicable: [S, T, R, I, D, E]
    not_applicable: []
    
  DataStore:
    applicable: [T, R, I, D]
    not_applicable: [S, E]
    
  DataFlow:
    applicable: [S, T, R, I, D]
    not_applicable: [E]

---
stride_threat_questions:

  S_questions:
    - Can an attacker impersonate a user?
    - Can an attacker impersonate a system component?
    - Are authentication credentials properly protected?
    - Is session management secure?
    
  T_questions:
    - Can an attacker modify data in transit?
    - Can an attacker modify data in storage?
    - Can an attacker modify application logic?
    - Are integrity checks in place?
    
  R_questions:
    - Can users deny their actions?
    - Are all critical actions logged?
    - Are logs protected from tampering?
    - Is there a way to verify user actions?
    
  I_questions:
    - Can sensitive data be exposed?
    - Is encryption properly implemented?
    - Are error messages safe?
    - Is access control properly implemented?
    
  D_questions:
    - Can the system be made unavailable?
    - Are there resource limits?
    - Can an attacker exhaust resources?
    - Is there graceful degradation?
    
  E_questions:
    - Can a user gain unauthorized privileges?
    - Are authorization checks consistent?
    - Is the principle of least privilege applied?
    - Are there insecure defaults?