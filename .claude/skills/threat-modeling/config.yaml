# Threat Modeling Skill Configuration
# Version: 1.0.0

---
skill:
  id: threat-modeling
  name: Threat Modeling
  version: 1.0.0
  type: fsm
  category: security-analysis
  
  description: |
    Comprehensive 8-phase FSM threat modeling workflow for security analysis.
    Follows STRIDE methodology, OWASP guidelines, and formal verification properties.
    
  author: SecHPS Team
  license: MIT
  
  tags:
    - security
    - threat-modeling
    - STRIDE
    - OWASP
    - risk-assessment

---
workflow:
  type: fsm
  
  nodes:
    - id: fsm-node-1
      type: fsm_phase
      label: 系统理解
      fsmPhase: 1
      fsmFixed: true
      fsmOrder: 1
      phases: [P1, P2]
      skillPath: phases/P1-P2
      
    - id: fsm-node-2
      type: fsm_phase
      label: 安全评估
      fsmPhase: 2
      fsmFixed: true
      fsmOrder: 2
      phases: [P3, P4]
      skillPath: phases/P3-P4
      
    - id: fsm-node-3
      type: fsm_phase
      label: 威胁分析
      fsmPhase: 3
      fsmFixed: true
      fsmOrder: 3
      phases: [P5, P6]
      skillPath: phases/P5-P6
      
    - id: fsm-node-4
      type: fsm_phase
      label: 报告生成
      fsmPhase: 4
      fsmFixed: true
      fsmOrder: 4
      phases: [P7, P8]
      skillPath: phases/P7-P8
      
  agentZone:
    position: 3
    type: agent-zone
    config:
      allowAdd: true
      allowDelete: true
      allowReorder: true
      parallel: true
    defaultAgents:
      - id: sast-agent
        name: SAST Agent
        tool: Semgrep
        output: vulnerabilities/sast-report.json
      - id: secret-scanner
        name: Secret Scanner
        tool: truffleHog
        output: vulnerabilities/secrets-report.json
      - id: dep-scanner
        name: Dependency Scanner
        tool: Snyk
        output: vulnerabilities/dependency-report.json

---
execution:
  protocol: 4-gate
  gates:
    - READ
    - ANALYZE
    - SYNTHESIZE
    - WRITE
    
  validation:
    enabled: true
    strict: true
    
  ralphLoop:
    enabled: true
    maxIterations: 3
    feedbackInjection: true
    experienceStorage: true

---
validation_properties:
  safety:
    - id: S1
      name: No Orphan Threats
      rule: 每个威胁必须关联到 DFD 元素
    - id: S2
      name: Count Conservation
      rule: 威胁计数守恒
    - id: S3
      name: No Unverified Mitigations
      rule: 每个 MIT-xxx 必须有 VR-xxx
    - id: S4
      name: Complete Coverage
      rule: discovery_checklist 100% coverage
      
  liveness:
    - id: L1
      name: Progress Guarantee
      rule: 每阶段必须产生非空输出
    - id: L2
      name: Completion Guarantee
      rule: 最终报告必须包含所有阶段输出

---
output:
  basePath: .claude/skills/threat-modeling
  
  phaseOutputs:
    path: outputs
    files:
      - P1_project_context.yaml
      - P2_dfd_elements.yaml
      - P3_boundary_context.yaml
      - P4_security_gaps.yaml
      - P5_threat_inventory.yaml
      - P6_validated_risks.yaml
      - P7_mitigation_plan.yaml
      
  reports:
    path: reports
    files:
      - RISK-ASSESSMENT-REPORT.md
      - RISK-INVENTORY.md
      - MITIGATION-MEASURES.md
      - PENETRATION-TEST-PLAN.md
      - ARCHITECTURE-ANALYSIS.md
      - DFD-DIAGRAM.md
      - COMPLIANCE-REPORT.md
      - ATTACK-PATH-VALIDATION.md
      
  agentOutputs:
    path: vulnerabilities
    files:
      - sast-report.json
      - secrets-report.json
      - dependency-report.json

---
knowledge:
  basePath: knowledge
  files:
    - STRIDE.yml
    - security_patterns.yml
    
  queryCommands:
    - command: kb --stride {category}
      description: Query STRIDE category details
    - command: kb --cwe {cwe-id}
      description: Query CWE details
    - command: kb --pattern {pattern-name}
      description: Query security pattern details

---
phases:
  count: 8
  
  P1:
    name: PROJECT-UNDERSTANDING
    node: fsm-node-1
    inputFile: null
    outputFile: P1_project_context.yaml
    
  P2:
    name: DFD-ANALYSIS
    node: fsm-node-1
    inputFile: P1_project_context.yaml
    outputFile: P2_dfd_elements.yaml
    
  P3:
    name: TRUST-BOUNDARY
    node: fsm-node-2
    inputFile: [P1, P2]
    outputFile: P3_boundary_context.yaml
    
  P4:
    name: SECURITY-DESIGN-REVIEW
    node: fsm-node-2
    inputFile: [P1, P2, P3]
    outputFile: P4_security_gaps.yaml
    
  P5:
    name: STRIDE-ANALYSIS
    node: fsm-node-3
    inputFile: [P1, P2, P3, P4]
    outputFile: P5_threat_inventory.yaml
    
  P6:
    name: RISK-VALIDATION
    node: fsm-node-3
    inputFile: [P1, P2, P5]
    outputFile: P6_validated_risks.yaml
    
  P7:
    name: MITIGATION-PLANNING
    node: fsm-node-4
    inputFile: [P1, P4, P5, P6]
    outputFile: P7_mitigation_plan.yaml
    
  P8:
    name: REPORT-GENERATION
    node: fsm-node-4
    inputFile: [P1-P7, Agent results, Workspace reports]
    outputFile: 8 reports

---
entity_ids:
  Module:
    format: M-{Seq:03d}
    example: M-001
    
  EntryPoint:
    format: EP-{TYPE}-{Seq:03d}
    example: EP-API-001
    
  Process:
    format: P-{Seq:03d}
    example: P-001
    
  DataStore:
    format: DS-{Seq:03d}
    example: DS-001
    
  DataFlow:
    format: DF-{Seq:03d}
    example: DF-001
    
  TrustBoundary:
    format: TB-{Seq:03d}
    example: TB-001
    
  Threat:
    format: T-{STRIDE}-{Element}-{Seq}
    example: T-S-P-001-001
    
  ValidatedRisk:
    format: VR-{Seq:03d}
    example: VR-001
    
  Mitigation:
    format: MIT-{Seq:03d}
    example: MIT-001
    
  POC:
    format: POC-{Seq:03d}
    example: POC-001
    
  SecurityGap:
    format: GAP-{Seq:03d}
    example: GAP-001