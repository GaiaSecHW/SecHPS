version: 2

# L1 Ontology categories by namespace.
# Each tag maps to ONTOLOGY:{namespace}:{name} in the tag system.

categories:
  # ---------------------------------------------------------
  # 1. 结构入口层 (Where does control flow enter?)
  # ---------------------------------------------------------
  ENTRY_POINT:
    - id: ep_network_listener
      name: NETWORK_LISTENER     # 归并 HTTP, RPC, WEBSOCKET
    - id: ep_ipc_handler
      name: IPC_HANDLER          # Message Queue, 进程间通信入口
    - id: ep_cli_command
      name: CLI_COMMAND
    - id: ep_plugin_hook
      name: PLUGIN_HOOK          # 动态加载、回调函数、FFI入口
    - id: ep_syscall_handler
      name: SYSCALL_HANDLER      # 系统调用入口
    - id: ep_ioctl_handler
      name: IOCTL_HANDLER        # 设备控制入口 (底层审计极度关注)
    - id: ep_hardware_irq
      name: HARDWARE_IRQ         # 硬件中断/MMIO触发的回调入口

  # ---------------------------------------------------------
  # 2. 数据来源层 (Where does the tainted data originate?)
  # ---------------------------------------------------------
  SOURCE:
    - id: source_network_data
      name: NETWORK_DATA
    - id: source_file_data
      name: FILE_DATA
    - id: source_env_data
      name: ENV_DATA             # 归并 ENV_VAR, CLI_ARGS
    - id: source_ipc_data
      name: IPC_DATA             # 共享内存、管道读出的数据
    - id: source_user_space
      name: USER_SPACE_DATA
    - id: source_hardware_state
      name: HARDWARE_STATE       # 寄存器状态、设备映射内存(MMIO)读入
    - id: source_deserialized
      name: DESERIALIZED_OBJECT

# ---------------------------------------------------------
  # 3. 危险操作层 (What sensitive operations are performed?)
  # 涵盖底层系统 (Memory/Kernel) 与应用层 (Web/Cloud) 的客观超集
  # ---------------------------------------------------------
  SINK:
    # --- 内存与底层 ---
    - id: sink_memory_write
      name: MEMORY_WRITE         # 覆盖：缓冲区溢出、越界写、任意地址写
    - id: sink_memory_read
      name: INFO_LEAK            # 覆盖：越界读、未初始化内存泄露 (如 copy_to_user)
    - id: sink_memory_alloc
      name: MEMORY_ALLOC         # 覆盖：整数溢出导致的错误分配 (如 malloc, kmalloc)
    - id: sink_memory_free
      name: MEMORY_FREE          # 覆盖：Double Free, UAF (如 free, kfree)
    
    # --- 系统与执行 ---
    - id: sink_privilege_mutation
      name: PRIVILEGE_MUTATION   # 覆盖：提权、凭证篡改 (如 commit_creds, setuid)
    - id: sink_os_command
      name: OS_COMMAND           # 覆盖：命令执行 (如 system, execve)
    - id: sink_code_eval
      name: CODE_EVAL            # 覆盖：代码注入、危险反序列化执行
    
    # --- I/O 与应用层 ---
    - id: sink_file_access
      name: FILE_ACCESS          # 覆盖：目录遍历、任意文件读写 (如 open, fopen)
    - id: sink_db_execute
      name: DB_EXECUTE           # 覆盖：SQL/NoSQL 注入
    - id: sink_view_render
      name: VIEW_RENDER          # 覆盖：XSS、模板注入

  # ---------------------------------------------------------
  # 4. 数据净化层 (How is the data MUTATED to be safe?)
  # ---------------------------------------------------------
  SANITIZER:
    - id: sanitizer_escape
      name: ESCAPE
    - id: sanitizer_encode
      name: ENCODE
    - id: sanitizer_type_cast
      name: TYPE_CAST            # 强转，可能引入截断或符号扩展问题
    - id: sanitizer_truncate
      name: TRUNCATE             # 长度截断
    - id: sanitizer_normalize
      name: NORMALIZE            # 路径标准化、编码统一

  # ---------------------------------------------------------
  # 5. 控制流守卫层 (How is reachability RESTRICTED?)
  # ---------------------------------------------------------
  GUARD:
    - id: guard_bounds_check
      name: BOUNDS_CHECK         # 边界/长度校验
    - id: guard_null_check
      name: NULL_CHECK           # 指针有效性校验
    - id: guard_type_check
      name: TYPE_CHECK           # 魔数、结构体类型校验
    - id: guard_auth_check
      name: AUTH_CHECK           # 鉴权、特权级(Capability)检查
    - id: guard_state_check
      name: STATE_CHECK          # 生命周期、锁状态、并发安全检查

  # ---------------------------------------------------------
  # 6. 架构角色层 (Architectural Context)
  # ---------------------------------------------------------
  ROLE:
    - id: role_boundary
      name: BOUNDARY             # 替代 CONTROLLER/HANDLER: 模块的最外层边界
    - id: role_logic
      name: LOGIC_PROVIDER       # 替代 SERVICE: 核心逻辑/协议实现
    - id: role_storage
      name: DATA_STORAGE         # 替代 REPOSITORY: 数据库、文件、内存数据库
    - id: role_infrastructure
      name: INFRASTRUCTURE       # 替代 MIDDLEWARE: 路由、缓存、日志等基础设施
    - id: role_driver
      name: DRIVER               # 硬件抽象层、外设驱动
    - id: role_kernel
      name: KERNEL_CORE          # 调度、内存管理、中断管理等绝对核心
    - id: role_utility
      name: UTILITY              # 无状态的工具函数库
