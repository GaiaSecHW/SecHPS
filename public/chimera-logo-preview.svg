<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- 羊皮纸/铜版底色 -->
    <radialGradient id="parchment" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#2C1A0A"/>
      <stop offset="70%" stop-color="#1A0E05"/>
      <stop offset="100%" stop-color="#0D0702"/>
    </radialGradient>
    <!-- 铜绿色调 -->
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A050"/>
      <stop offset="40%" stop-color="#A07828"/>
      <stop offset="100%" stop-color="#7A5010"/>
    </linearGradient>
    <!-- 火焰 -->
    <linearGradient id="fire" x1="0%" y1="100%" x2="20%" y2="0%">
      <stop offset="0%" stop-color="#8B1A00"/>
      <stop offset="35%" stop-color="#CC4400"/>
      <stop offset="70%" stop-color="#E87820"/>
      <stop offset="100%" stop-color="#F5C030"/>
    </linearGradient>
    <!-- 蛇绿 -->
    <linearGradient id="serpent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4A28"/>
      <stop offset="100%" stop-color="#2E7040"/>
    </linearGradient>
    <!-- 雕刻纹理滤镜 -->
    <filter id="engrave" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 外发光 -->
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── 背景 ── -->
  <circle cx="150" cy="150" r="148" fill="url(#parchment)"/>

  <!-- 外圈装饰（双环） -->
  <circle cx="150" cy="150" r="147" fill="none" stroke="#8B6010" stroke-width="2.5"/>
  <circle cx="150" cy="150" r="141" fill="none" stroke="#5A3A08" stroke-width="0.8"/>
  <circle cx="150" cy="150" r="136" fill="none" stroke="#8B6010" stroke-width="1.2"/>

  <!-- 圆环内装饰点 -->
  <circle cx="150" cy="4"   r="2.5" fill="#A07828"/>
  <circle cx="150" cy="296" r="2.5" fill="#A07828"/>
  <circle cx="4"   cy="150" r="2.5" fill="#A07828"/>
  <circle cx="296" cy="150" r="2.5" fill="#A07828"/>
  <circle cx="46"  cy="46"  r="2"   fill="#A07828"/>
  <circle cx="254" cy="46"  r="2"   fill="#A07828"/>
  <circle cx="46"  cy="254" r="2"   fill="#A07828"/>
  <circle cx="254" cy="254" r="2"   fill="#A07828"/>

  <!-- ══════════════════════════════════════
       狮身（侧面，朝左，伊特鲁里亚风格）
       肌肉紧绷、鬃毛竖立
       ══════════════════════════════════════ -->

  <!-- 躯干主体 -->
  <path d="M 100,185
           C  88,178  82,165  84,152
           C  86,139  94,130 108,126
           C 122,122 140,122 156,126
           C 170,130 180,138 182,150
           C 184,162 178,174 166,180
           C 154,186 136,190 118,190
           C 108,190 104,188 100,185 Z"
        fill="url(#bronze)" stroke="#6A4008" stroke-width="1.2"/>

  <!-- 肩胛骨隆起（肌肉感） -->
  <path d="M 104,152 C 108,144 118,140 128,142 C 120,148 112,154 104,152 Z"
        fill="#B88830" opacity="0.7"/>
  <path d="M 118,148 C 124,140 136,138 144,142 C 136,148 126,152 118,148 Z"
        fill="#B88830" opacity="0.5"/>

  <!-- 腹部线条（雕刻感） -->
  <path d="M 108,168 C 120,172 140,172 158,168" fill="none" stroke="#6A4008" stroke-width="1.5"/>
  <path d="M 112,176 C 124,180 144,180 160,176" fill="none" stroke="#6A4008" stroke-width="1"/>

  <!-- 前腿（左，粗壮） -->
  <path d="M  96,182
           C  90,192  88,206  88,218
           C  88,226  90,232  96,234
           C 102,236 108,232 110,224
           C 112,216 112,202 110,190
           C 106,186 100,184  96,182 Z"
        fill="url(#bronze)" stroke="#6A4008" stroke-width="1.2"/>
  <!-- 前爪 -->
  <path d="M 88,230 C 84,236 82,240 86,242 C 90,244 94,240 96,234" fill="url(#bronze)" stroke="#6A4008" stroke-width="1"/>
  <path d="M 96,234 C 96,240 98,244 102,244 C 106,244 108,240 108,234" fill="url(#bronze)" stroke="#6A4008" stroke-width="1"/>
  <path d="M 108,232 C 110,238 114,242 118,240 C 122,238 122,232 118,226" fill="url(#bronze)" stroke="#6A4008" stroke-width="1"/>

  <!-- 前腿（右） -->
  <path d="M 116,186
           C 112,196 110,210 112,222
           C 113,230 116,234 122,234
           C 128,234 132,230 132,222
           C 132,212 130,198 126,188
           C 122,186 118,186 116,186 Z"
        fill="url(#bronze)" stroke="#6A4008" stroke-width="1.2"/>
  <!-- 前爪右 -->
  <path d="M 112,230 C 110,236 112,242 116,242 C 120,242 122,238 122,232" fill="url(#bronze)" stroke="#6A4008" stroke-width="1"/>
  <path d="M 122,232 C 122,238 124,242 128,242 C 132,242 134,238 132,232" fill="url(#bronze)" stroke="#6A4008" stroke-width="1"/>

  <!-- 后腿（左） -->
  <path d="M 148,186
           C 146,196 146,210 148,220
           C 150,228 154,232 160,232
           C 166,232 170,228 170,220
           C 170,210 168,196 164,186
           C 158,184 152,184 148,186 Z"
        fill="url(#bronze)" stroke="#6A4008" stroke-width="1.2"/>

  <!-- 后腿（右） -->
  <path d="M 166,184
           C 166,194 168,208 170,218
           C 172,226 176,230 182,228
           C 188,226 190,220 188,212
           C 186,204 182,192 176,184
           C 172,182 168,182 166,184 Z"
        fill="url(#bronze)" stroke="#6A4008" stroke-width="1.2"/>

  <!-- 后爪 -->
  <path d="M 148,228 C 146,234 148,240 152,240 C 156,240 158,236 158,230" fill="url(#bronze)" stroke="#6A4008" stroke-width="1"/>
  <path d="M 158,230 C 158,236 160,240 164,240 C 168,240 170,236 168,230" fill="url(#bronze)" stroke="#6A4008" stroke-width="1"/>
  <path d="M 170,226 C 170,232 172,238 176,238 C 180,238 182,234 180,228" fill="url(#bronze)" stroke="#6A4008" stroke-width="1"/>

  <!-- ══════════════════════════════════════
       狮首（左侧，侧面，鬃毛竖立）
       参考伊特鲁里亚青铜风格
       ══════════════════════════════════════ -->

  <!-- 鬃毛（竖立，多层放射状） -->
  <!-- 外层鬃毛 -->
  <path d="M 72,108 C 60,96 52,80 56,66 C 60,52 70,46 72,52" fill="#7A5010" stroke="#5A3808" stroke-width="1"/>
  <path d="M 76,100 C 62,90 52,72 58,58 C 62,48 72,44 74,50" fill="#8A6018" stroke="#5A3808" stroke-width="1"/>
  <path d="M 82,94  C 70,82 64,64 72,52 C 76,44 86,42 86,50" fill="#9A7020" stroke="#5A3808" stroke-width="1"/>
  <path d="M 90,90  C 80,76 78,58 88,48 C 94,42 102,42 100,50" fill="#A07828" stroke="#5A3808" stroke-width="1"/>
  <path d="M 98,88  C 92,74 94,56 104,48 C 110,44 118,46 114,54" fill="#9A7020" stroke="#5A3808" stroke-width="1"/>
  <path d="M 106,88 C 104,74 108,58 118,52 C 124,48 130,52 126,60" fill="#8A6018" stroke="#5A3808" stroke-width="1"/>
  <path d="M 112,92 C 114,78 120,64 130,60 C 136,58 140,62 136,70" fill="#7A5010" stroke="#5A3808" stroke-width="1"/>

  <!-- 内层鬃毛（更亮） -->
  <path d="M 78,106 C 68,96 64,82 70,70 C 74,62 82,60 82,66" fill="#B88830" stroke="#8A6018" stroke-width="0.8"/>
  <path d="M 86,98  C 78,86 78,70 88,62 C 94,56 102,58 100,66" fill="#C09038" stroke="#8A6018" stroke-width="0.8"/>
  <path d="M 96,94  C 92,80 96,64 108,58 C 114,56 120,60 116,68" fill="#B88830" stroke="#8A6018" stroke-width="0.8"/>
  <path d="M 106,94 C 106,80 114,66 124,64 C 130,62 134,68 130,76" fill="#A07828" stroke="#8A6018" stroke-width="0.8"/>

  <!-- 脸部（侧面） -->
  <path d="M 82,118
           C 76,112 72,104 74,96
           C 76,88 82,84 90,84
           C 98,84 106,88 112,96
           C 118,104 118,114 114,120
           C 110,126 104,130 96,130
           C 88,130 84,124 82,118 Z"
        fill="#D4A040" stroke="#8A6018" stroke-width="1.5"/>

  <!-- 眉弓（威严） -->
  <path d="M 82,100 C 86,94 94,92 100,94" fill="none" stroke="#5A3808" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 眼睛（琥珀色，有神） -->
  <ellipse cx="92" cy="102" rx="7" ry="6" fill="#CC8800"/>
  <ellipse cx="92" cy="102" rx="3" ry="5.5" fill="#1A0A00"/>
  <circle  cx="90" cy="100" r="2" fill="white" opacity="0.6"/>
  <!-- 眼眶线 -->
  <ellipse cx="92" cy="102" rx="7" ry="6" fill="none" stroke="#5A3808" stroke-width="1.2"/>

  <!-- 鼻梁 -->
  <path d="M 100,108 C 104,112 108,114 110,118" fill="none" stroke="#8A6018" stroke-width="2" stroke-linecap="round"/>

  <!-- 鼻子 -->
  <path d="M 108,118 C 110,116 114,116 116,118 C 118,120 116,124 112,124 C 108,124 106,120 108,118 Z"
        fill="#A07828" stroke="#6A4808" stroke-width="1"/>

  <!-- 张口（侧面，上下颚） -->
  <!-- 上颚 -->
  <path d="M 96,128 C 100,132 108,134 116,132 C 120,130 122,126 120,122"
        fill="#8B1A00" stroke="#5A0800" stroke-width="1.2"/>
  <!-- 下颚 -->
  <path d="M 96,128 C 100,136 108,140 116,138 C 120,136 122,132 120,128"
        fill="#6B1000" stroke="#5A0800" stroke-width="1.2"/>
  <!-- 牙齿（侧面，犬齿突出） -->
  <polygon points="100,128 98,138 104,128" fill="#F0EAD0"/>
  <polygon points="106,130 104,140 110,130" fill="#F0EAD0"/>
  <polygon points="112,130 110,138 116,130" fill="#E8E0C8"/>
  <!-- 犬齿（最突出） -->
  <polygon points="98,128 94,142 102,128" fill="white"/>

  <!-- ══════════════════════════════════════
       火焰（从狮口喷出，向左上）
       铜版雕刻风格：多层细线条
       ══════════════════════════════════════ -->

  <!-- 火焰外轮廓 -->
  <path d="M 88,132
           C 76,122 60,110 50,96
           C 40,82 40,66 32,54
           C 38,60 44,56 42,46
           C 48,56 50,50 48,40
           C 54,52 58,48 56,36
           C 62,50 66,46 64,34
           C 70,50 72,56 66,68
           C 74,60 78,52 76,40
           C 82,56 80,68 72,80
           C 68,88 66,100 72,112
           C 76,120 82,128 88,132 Z"
        fill="url(#fire)" filter="url(#outerGlow)"/>

  <!-- 火焰内层（亮黄核心） -->
  <path d="M 82,128
           C 72,118 60,106 54,92
           C 48,78 50,64 44,54
           C 50,60 54,56 52,46
           C 58,58 58,66 52,76
           C 60,68 64,60 62,48
           C 68,62 66,74 60,84
           C 58,92 60,106 68,116
           C 72,122 78,126 82,128 Z"
        fill="#F5C030" opacity="0.7"/>

  <!-- 火焰雕刻线条（质感） -->
  <path d="M 60,100 C 52,88 48,74 52,62" fill="none" stroke="#FF8020" stroke-width="1" opacity="0.8"/>
  <path d="M 66,108 C 58,94 56,78 62,66" fill="none" stroke="#FFB030" stroke-width="0.8" opacity="0.7"/>
  <path d="M 72,116 C 66,100 66,84 72,72" fill="none" stroke="#FFD040" stroke-width="0.8" opacity="0.6"/>

  <!-- ══════════════════════════════════════
       羊首（从背部中央探出，朝右）
       蛇尾咬羊角（伊特鲁里亚经典构图）
       ══════════════════════════════════════ -->

  <!-- 羊颈 -->
  <path d="M 138,128 C 144,116 152,106 162,98"
        fill="none" stroke="#C09030" stroke-width="14" stroke-linecap="round"/>
  <path d="M 138,128 C 144,116 152,106 162,98"
        fill="none" stroke="#D4A840" stroke-width="9" stroke-linecap="round"/>
  <!-- 颈部肌肉线 -->
  <path d="M 140,124 C 146,112 154,102 164,96"
        fill="none" stroke="#A07828" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 羊头（侧面，朝右） -->
  <path d="M 162,98
           C 170,94 180,94 188,98
           C 196,102 200,110 198,118
           C 196,126 188,130 180,130
           C 172,130 164,126 160,118
           C 156,110 156,102 162,98 Z"
        fill="#C09030" stroke="#8A6018" stroke-width="1.5"/>

  <!-- 羊嘴/鼻（长脸特征） -->
  <path d="M 188,98 C 198,100 206,106 208,114 C 210,120 206,126 200,128"
        fill="#A87820" stroke="#7A5810" stroke-width="1.2"/>
  <!-- 鼻孔 -->
  <ellipse cx="204" cy="116" rx="3" ry="2.5" fill="#7A5010" transform="rotate(-10,204,116)"/>
  <ellipse cx="200" cy="120" rx="2.5" ry="2" fill="#7A5010" transform="rotate(-10,200,120)"/>

  <!-- 羊眼（侧面，矩形瞳孔——山羊特征） -->
  <ellipse cx="170" cy="108" rx="6" ry="5" fill="#CC8800"/>
  <rect x="167" y="106" width="6" height="4" rx="1" fill="#1A0A00" transform="rotate(-5,170,108)"/>
  <circle cx="168" cy="106" r="1.5" fill="white" opacity="0.5"/>
  <ellipse cx="170" cy="108" rx="6" ry="5" fill="none" stroke="#7A5010" stroke-width="1.2"/>

  <!-- 羊角（标志性弯角，粗壮） -->
  <!-- 左角 -->
  <path d="M 164,96 C 156,82 154,66 162,56 C 168,48 178,48 180,58 C 182,66 176,76 168,80"
        fill="none" stroke="#C09030" stroke-width="8" stroke-linecap="round"/>
  <path d="M 164,96 C 156,82 154,66 162,56 C 168,48 178,48 180,58 C 182,66 176,76 168,80"
        fill="none" stroke="#E0B840" stroke-width="4" stroke-linecap="round"/>
  <!-- 角纹（横纹） -->
  <path d="M 158,84 C 160,80 164,78 168,80" fill="none" stroke="#A07828" stroke-width="1.5"/>
  <path d="M 156,76 C 158,70 162,68 166,70" fill="none" stroke="#A07828" stroke-width="1.5"/>
  <path d="M 158,68 C 160,62 164,60 168,62" fill="none" stroke="#A07828" stroke-width="1.5"/>

  <!-- 右角 -->
  <path d="M 176,94 C 172,80 174,64 182,56 C 188,50 198,52 198,62 C 198,70 192,78 184,80"
        fill="none" stroke="#C09030" stroke-width="8" stroke-linecap="round"/>
  <path d="M 176,94 C 172,80 174,64 182,56 C 188,50 198,52 198,62 C 198,70 192,78 184,80"
        fill="none" stroke="#E0B840" stroke-width="4" stroke-linecap="round"/>
  <!-- 角纹 -->
  <path d="M 182,82 C 186,78 190,78 192,82" fill="none" stroke="#A07828" stroke-width="1.5"/>
  <path d="M 180,74 C 184,68 188,68 190,72" fill="none" stroke="#A07828" stroke-width="1.5"/>
  <path d="M 180,66 C 184,60 188,60 190,64" fill="none" stroke="#A07828" stroke-width="1.5"/>

  <!-- 羊胡子 -->
  <path d="M 200,126 C 204,134 202,142 198,148" fill="none" stroke="#C09030" stroke-width="4" stroke-linecap="round"/>
  <path d="M 204,124 C 210,132 210,142 206,148" fill="none" stroke="#A07828" stroke-width="3" stroke-linecap="round"/>
  <path d="M 198,128 C 200,136 198,144 194,148" fill="none" stroke="#B08828" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ══════════════════════════════════════
       蛇尾（从躯干末端延伸，盘旋咬羊角）
       伊特鲁里亚经典：蛇尾咬住羊角
       ══════════════════════════════════════ -->

  <!-- 蛇身主体 -->
  <path d="M 186,178
           C 200,168 214,156 218,140
           C 222,124 214,110 218,96
           C 222,82 232,74 228,62
           C 224,52 214,50 208,56
           C 202,62 202,72 206,80
           C 210,88 214,94 212,102
           C 210,110 202,114 196,108
           C 190,102 188,92 190,82"
        fill="none" stroke="#1A4A28" stroke-width="14" stroke-linecap="round"/>
  <path d="M 186,178
           C 200,168 214,156 218,140
           C 222,124 214,110 218,96
           C 222,82 232,74 228,62
           C 224,52 214,50 208,56
           C 202,62 202,72 206,80
           C 210,88 214,94 212,102
           C 210,110 202,114 196,108
           C 190,102 188,92 190,82"
        fill="none" stroke="#2E7040" stroke-width="9" stroke-linecap="round"/>

  <!-- 蛇鳞纹理 -->
  <path d="M 186,178 C 200,168 214,156 218,140 C 222,124 214,110 218,96 C 222,82 232,74 228,62 C 224,52 214,50 208,56 C 202,62 202,72 206,80 C 210,88 214,94 212,102 C 210,110 202,114 196,108 C 190,102 188,92 190,82"
        fill="none" stroke="#3D9050" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,10"/>

  <!-- 蛇头（咬住羊角） -->
  <path d="M 190,82
           C 186,74 182,68 180,62
           C 178,56 180,50 186,48
           C 192,46 198,50 198,56"
        fill="none" stroke="#1A4A28" stroke-width="12" stroke-linecap="round"/>
  <path d="M 190,82
           C 186,74 182,68 180,62
           C 178,56 180,50 186,48
           C 192,46 198,50 198,56"
        fill="none" stroke="#2E7040" stroke-width="7" stroke-linecap="round"/>

  <!-- 蛇头轮廓（扁平三角形） -->
  <path d="M 186,80 C 180,74 176,66 178,58 C 180,50 188,46 194,50 C 200,54 200,62 196,68 C 192,74 188,78 186,80 Z"
        fill="#1A4A28" stroke="#0E2E18" stroke-width="1.5"/>
  <path d="M 186,80 C 182,74 180,66 182,58 C 184,52 190,50 194,54 C 198,58 196,66 192,72 C 190,76 188,78 186,80 Z"
        fill="#2E7040"/>

  <!-- 蛇眼（金色，竖瞳） -->
  <ellipse cx="184" cy="62" rx="4" ry="3.5" fill="#D4A000"/>
  <ellipse cx="184" cy="62" rx="1.5" ry="3" fill="#0A0A0A"/>
  <circle  cx="183" cy="61" r="1" fill="white" opacity="0.6"/>

  <!-- 蛇信（分叉） -->
  <path d="M 194,52 L 202,46 M 194,52 L 202,56"
        stroke="#CC0000" stroke-width="2" stroke-linecap="round"/>

  <!-- 蛇咬羊角（咬合处） -->
  <path d="M 186,58 C 182,54 180,58 182,62" fill="none" stroke="#0E2E18" stroke-width="3" stroke-linecap="round"/>

  <!-- ══════════════════════════════════════
       底部铭文
       ══════════════════════════════════════ -->
  <!-- 装饰横线 -->
  <line x1="80" y1="264" x2="220" y2="264" stroke="#8B6010" stroke-width="1"/>
  <line x1="90" y1="268" x2="210" y2="268" stroke="#5A3808" stroke-width="0.5"/>

  <!-- 主文字 -->
  <text x="150" y="258"
        text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif"
        font-size="18"
        font-weight="bold"
        letter-spacing="6"
        fill="#C8A030">CHIMERA</text>

  <!-- 副文字（拉丁风格） -->
  <text x="150" y="278"
        text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, Georgia, serif"
        font-size="9"
        letter-spacing="3"
        fill="#7A5010">· SECURITY PLATFORM ·</text>

  <!-- 装饰菱形 -->
  <polygon points="150,282 154,286 150,290 146,286" fill="#8B6010" opacity="0.6"/>
</svg>
