apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirmera-sechps
  namespace: secflow-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      name: chirmera-sechps
  template:
    metadata:
      labels:
        name: chirmera-sechps
    spec:
      initContainers:
        - name: wait-for-db-init
          image: ghcr.io/gaiasechw/sechps:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: chirmera-sechps-config
            - secretRef:
                name: chirmera-sechps-secret
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              echo "[wait-for-db-init] waiting for table CodeswarmWorker..."
              for i in $(seq 1 120); do
                if node -e "const { Client } = require('pg'); const client = new Client({ connectionString: process.env.DATABASE_URL }); client.connect().then(() => client.query('SELECT to_regclass(\\'public.\"CodeswarmWorker\"\\') AS reg')).then((res) => client.end().then(() => { const exists = !!res.rows?.[0]?.reg; process.exit(exists ? 0 : 1); })).catch(() => process.exit(1));"; then
                  echo "[wait-for-db-init] CodeswarmWorker exists"
                  exit 0
                fi
                echo "[wait-for-db-init] schema not ready, retry ${i}/120"
                sleep 5
              done
              echo "[wait-for-db-init] timeout waiting for schema"
              exit 1
      containers:
        - name: chirmera-sechps
          image: ghcr.io/gaiasechw/sechps:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: chirmera-sechps-config
            - secretRef:
                name: chirmera-sechps-secret
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: chirmera-sechps-data
              mountPath: /app/data
            - name: chirmera-sechps-uploads
              mountPath: /app/uploads
            - name: chirmera-sechps-skills
              mountPath: /app/skill_management
            - name: chirmera-sechps-agent-harness
              mountPath: /app/AgentHarness
          livenessProbe:
            httpGet:
              path: /api/global/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/global/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
      volumes:
        - name: chirmera-sechps-data
          persistentVolumeClaim:
            claimName: chirmera-sechps-data-pvc
        - name: chirmera-sechps-uploads
          persistentVolumeClaim:
            claimName: chirmera-sechps-uploads-pvc
        - name: chirmera-sechps-skills
          persistentVolumeClaim:
            claimName: chirmera-sechps-skills-pvc
        - name: chirmera-sechps-agent-harness
          persistentVolumeClaim:
            claimName: chirmera-sechps-agent-harness-pvc
