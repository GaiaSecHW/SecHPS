apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeswarm-scheduler
  namespace: secflow-ns
  labels:
    app: scheduler
    component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
        component: scheduler
    spec:
      imagePullSecrets:
        - name: ghcr-ict-bin-pull
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 1000
      containers:
        - name: scheduler
          image: ghcr.io/gaiasechw/codeswarm-scheduler:dev_secflow_codeswarm
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: codeswarm-config
            - secretRef:
                name: codeswarm-secrets
          volumeMounts:
            - name: shared-data
              mountPath: /data
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: secflow-platform-fileserver-data-nfs-pvc
