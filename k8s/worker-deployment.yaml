apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeswarm-worker
  namespace: secflow-ns
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2   # HPA 管理，此处为初始值
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: worker
          image: ghcr.io/gaiasechw/codeswarm-worker:dev_secflow_codeswarm
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PORT
              value: "8080"
            - name: SCHEDULER_URL
              value: "http://scheduler:8080"
            - name: MAX_CONCURRENT
              value: "5"
            - name: TASK_TIMEOUT_SEC
              value: "86400"
            - name: GRACEFUL_SHUTDOWN_TIMEOUT_MS
              value: "300000"
            - name: WORKSPACE_BASE_PATH
              value: "/data/codeswarm-workspace"
          envFrom:
            - secretRef:
                name: codeswarm-secrets
          volumeMounts:
            - name: fileserver
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]   # 让 K8s 等待 endpoint 摘除
      terminationGracePeriodSeconds: 360   # 6min — 给 draining 留时间
      volumes:
        - name: fileserver
          persistentVolumeClaim:
            claimName: secflow-platform-fileserver-data-nfs-pvc
