apiVersion: v1
kind: Secret
metadata:
  name: codeswarm-secrets
  namespace: secflow-ns
type: Opaque
stringData:
  DATABASE_URL: "postgresql://codeswarm:CHANGE_ME@postgresql:5432/codeswarm"
  JWT_SECRET: "CHANGE_ME_TO_RANDOM_SECRET"
  # MinIO (可选)
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_ACCESS_KEY: "CHANGE_ME"
  MINIO_SECRET_KEY: "CHANGE_ME"
  MINIO_BUCKET: "codeswarm"
  MINIO_USE_SSL: "false"
