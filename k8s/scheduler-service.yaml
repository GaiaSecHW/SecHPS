apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: secflow-ns
  labels:
    app.kubernetes.io/name: scheduler
spec:
  selector:
    app: scheduler
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
---
# Headless Service for Pod 直连（Worker → Scheduler 心跳）
apiVersion: v1
kind: Service
metadata:
  name: scheduler-headless
  namespace: secflow-ns
spec:
  selector:
    app: scheduler
  ports:
    - port: 8080
      targetPort: 8080
  clusterIP: None
