apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: secflow-ns
  labels:
    app: scheduler
    component: scheduler
spec:
  type: ClusterIP
  selector:
    app: scheduler
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-headless
  namespace: secflow-ns
  labels:
    app: scheduler
    component: scheduler
spec:
  clusterIP: None
  selector:
    app: scheduler
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
