apiVersion: v1
kind: ConfigMap
metadata:
  name: codeswarm-config
  namespace: secflow-ns
data:
  NODE_ENV: "production"
  PORT: "8080"
  WORKSPACE_BASE_PATH: "/data/codeswarm-workspace"
  TASK_CLEANUP_RETENTION_DAYS: "30"
  LOG_LEVEL: "info"
  REDIS_URL: "redis://codeswarm-redis:6379"
  MAX_CONCURRENT: "5"
  TASK_TIMEOUT_SEC: "86400"
  GRACEFUL_SHUTDOWN_TIMEOUT_MS: "300000"
  AIGW_WORK_KEYS_URL: "http://gaiasec-api-gateway.secflow-ns.svc.cluster.local"
  .npmrc: |
    # npm 配置
    # 注意：部署时不要使用 --omit=optional 或 --production 标志
    # 否则会跳过 @anthropic-ai/claude-agent-sdk 的平台二进制依赖
    strict-ssl=false
    always-auth=false
    registry=https://mirrors.tools.huawei.com/npm
