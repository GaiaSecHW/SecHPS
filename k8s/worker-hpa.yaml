apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: secflow-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300    # 5min 观察窗口
      policies:
        - type: Pods
          value: 1                        # 每次最多缩 1 个 Pod
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 3                        # 每次最多扩 3 个 Pod
          periodSeconds: 60
  metrics:
    - type: External
      external:
        metric:
          name: codeswarm_queue_depth     # 来自 Prometheus Adapter
        target:
          type: AverageValue
          averageValue: "2"               # 每个 Pod 处理 2 个排队任务
