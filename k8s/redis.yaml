apiVersion: v1
kind: Service
metadata:
  name: codeswarm-redis
  namespace: secflow-ns
  labels:
    app: codeswarm-redis
    component: cache
spec:
  type: NodePort
  selector:
    app: codeswarm-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 31379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeswarm-redis
  namespace: secflow-ns
  labels:
    app: codeswarm-redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codeswarm-redis
  template:
    metadata:
      labels:
        app: codeswarm-redis
        component: cache
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          args:
            - redis-server
            - --appendonly
            - "yes"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: codeswarm-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codeswarm-redis-data
  namespace: secflow-ns
  labels:
    app: codeswarm-redis
    component: cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-storage-192.168.13.66
  resources:
    requests:
      storage: 5Gi
