apiVersion: v1
kind: Service
metadata:
  name: codeswarm-postgres
  namespace: secflow-ns
  labels:
    app.kubernetes.io/name: codeswarm-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: codeswarm-service
spec:
  type: NodePort
  selector:
    app: codeswarm-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      nodePort: 31432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeswarm-postgres
  namespace: secflow-ns
  labels:
    app.kubernetes.io/name: codeswarm-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: codeswarm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codeswarm-postgres
  template:
    metadata:
      labels:
        app: codeswarm-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: codeswarm-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: codeswarm-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codeswarm-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: secflow-ns
  labels:
    app.kubernetes.io/name: codeswarm-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: codeswarm-service
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-storage-192.168.13.66
  resources:
    requests:
      storage: 10Gi
