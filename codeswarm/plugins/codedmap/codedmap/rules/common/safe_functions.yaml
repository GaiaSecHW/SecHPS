version: 2

# Language-agnostic safe/harmless functions (whitelist).
# Functions listed here are excluded from sink/source classification.

safe_functions:
  # Basic Utils
  - id: safe_len
    name: len
  - id: safe_length
    name: length
  - id: safe_size
    name: size
  - id: safe_sizeof
    name: sizeof
  - id: safe_count
    name: count
  - id: safe_tostring
    name: tostring
  - id: safe_str
    name: str
  - id: safe_int
    name: int
  - id: safe_float
    name: float
  - id: safe_bool
    name: bool
  - id: safe_format
    name: format
  - id: safe_strip
    name: strip
  - id: safe_trim
    name: trim

  # Logging
  - id: safe_log
    name: log
  - id: safe_info
    name: info
  - id: safe_debug
    name: debug
  - id: safe_warn
    name: warn
  - id: safe_error
    name: error
  - id: safe_assert
    name: assert

  # Memory Management (Safe context)
  - id: safe_malloc
    name: malloc
  - id: safe_calloc
    name: calloc
  - id: safe_new
    name: new

  # Explicit Sanitizers (Common Names)
  - id: safe_escape
    name: escape
  - id: safe_encode
    name: encode
  - id: safe_htmlspecialchars
    name: htmlspecialchars
  - id: safe_urlencode
    name: urlencode
  - id: safe_sanitize
    name: sanitize
  - id: safe_validate
    name: validate
  - id: safe_check
    name: check
