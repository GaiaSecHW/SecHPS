P3_boundary_context:
  boundaries:
    - id: B-001
      name: Application Boundary
      type: Trust Boundary
      description: Boundary between user and application
    - id: B-002
      name: Database Boundary
      type: Trust Boundary
      description: Boundary between application and database
  
  zones:
    - id: Z-001
      name: Public Zone
      boundary: B-001
      elements:
        - EI-001
      trust_level: LOW
    - id: Z-002
      name: Application Zone
      boundary: B-001
      elements:
        - P-001
        - P-002
      trust_level: MEDIUM
    - id: Z-003
      name: Data Zone
      boundary: B-002
      elements:
        - DS-001
      trust_level: HIGH
  
  element_zone_mapping:
    - element_id: EI-001
      zone_id: Z-001
    - element_id: P-001
      zone_id: Z-002
    - element_id: DS-001
      zone_id: Z-003