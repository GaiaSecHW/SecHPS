P1_project_context:
  project_context:
    project_type: web
    tech_stack:
      - framework: Next.js
      - language: TypeScript
      - runtime: Node.js
    security_dependencies:
      - name: bcryptjs
        version: 2.4.3
        purpose: auth
      - name: jsonwebtoken
        version: 9.0.0
        purpose: auth

  module_inventory:
    modules:
      - id: M-001
        name: auth-service
        path: src/lib/auth
        security_level: HIGH
        functions:
          - name: verifyToken
            security_relevant: true
          - name: hasPermission
            security_relevant: true
        dependencies: []

  entry_point_inventory:
    entry_points:
      - id: EP-API-001
        type: API
        path: src/app/api/auth/login/route.ts
        module_ref: M-001
        auth_required: false
        input_types:
          - email
          - password
        output_types:
          - token
          - user
        security_sensitive: true
      - id: EP-API-002
        type: API
        path: src/app/api/sessions/route.ts
        module_ref: M-002
        auth_required: true
        input_types: []
        output_types:
          - sessions
        security_sensitive: true

  discovery_checklist:
    checklist:
      api: { scanned: true, count: 30 }
      ui: { scanned: true, count: 145 }
      cli: { scanned: true, count: 0 }
      websocket: { scanned: true, count: 0 }
      background: { scanned: true, count: 0 }
      database: { scanned: true, count: 1 }
      file: { scanned: true, count: 1 }
      event: { scanned: true, count: 0 }
      queue: { scanned: true, count: 0 }
      hook: { scanned: true, count: 0 }
      plugin: { scanned: true, count: 0 }
      service: { scanned: true, count: 0 }
      graphql: { scanned: true, count: 0 }
      cron: { scanned: true, count: 0 }

  security_notes:
    - finding: JWT secret in environment variable
      location: .env
      severity: INFO