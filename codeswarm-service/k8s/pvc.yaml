apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-workspace
  namespace: codeswarm
  labels:
    app.kubernetes.io/name: codeswarm-workspace
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs            # NFS StorageClass — 集群需预配置
  resources:
    requests:
      storage: 100Gi
